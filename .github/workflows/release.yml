name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  deployments: write
  actions: read

jobs:
  release-windows:
    name: Package Windows installers
    runs-on: windows-2022
    environment: production
    steps:
    - name: Wait for Windows builds to complete
      shell: powershell
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET_SHA: ${{ github.sha }}
        GH_REPO: ${{ github.repository }}
      run: |
        $headers = @{
          "Authorization" = "Bearer $env:GH_TOKEN"
          "Accept" = "application/vnd.github+json"
        }
        $checksToWait = @("Build Windows", "Build Windows (ARM)")
        Write-Host "Waiting for checks [$($checksToWait -join ', ')] on commit $env:TARGET_SHA..."
        
        $timeout = (Get-Date).AddMinutes(45)
        do {
          $url = "https://api.github.com/repos/$env:GH_REPO/commits/$env:TARGET_SHA/check-runs?per_page=100"
          $res = Invoke-RestMethod -Uri $url -Headers $headers
          $allComplete = $true
          foreach ($checkName in $checksToWait) {
            $matching = $res.check_runs | Where-Object { $_.name -eq $checkName }
            $latest = $matching | Sort-Object completed_at -Descending | Select-Object -First 1
            if (-not $latest -or $latest.status -ne "completed") {
              $statusStr = if ($latest) { $latest.status } else { "not started" }
              Write-Host "Check '$checkName' is not completed yet ($statusStr). Waiting..."
              $allComplete = $false
              break
            }
            if ($latest.conclusion -ne "success" -and $latest.conclusion -ne "skipped") {
              Write-Error "Check '$checkName' finished with conclusion: $($latest.conclusion)"
              exit 1
            }
          }
          if ($allComplete) {
            Write-Host "All required Windows build checks completed successfully!"
            break
          }
          if ((Get-Date) -gt $timeout) {
            Write-Error "Timed out waiting for build checks to complete."
            exit 1
          }
          Start-Sleep -Seconds 15
        } while (-not $allComplete)
    - uses: actions/checkout@v4
    - name: Download ROM
      run: git clone https://github.com/MCJack123/craftos2-rom $env:GITHUB_WORKSPACE\craftos2-rom
    - name: Download resources
      run: git clone -c core.protectNTFS=false https://github.com/MCJack123/craftos2-release-resources $env:GITHUB_WORKSPACE\craftos2-release-resources
    - name: Download built executables
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: main.yml
        commit: ${{ github.sha }}
        name: CraftOS-PC-Artifact
        path: ${{ github.workspace }}\bin
    - name: Download built executables (ARM)
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: main.yml
        commit: ${{ github.sha }}
        name: CraftOS-PC-Artifact-ARM64
        path: ${{ github.workspace }}\bin-arm
    - name: Build installer
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        if ($env:GITHUB_REF -match "[0-9]+(\.[0-9]+)+") {
            $VERSION = $matches[0]
        } elseif ($env:TAG_NAME -match "[0-9]+(\.[0-9]+)+") {
            $VERSION = $matches[0]
        } else {
            $VERSION = "2.8.4"
        }
        $issPath = "$env:GITHUB_WORKSPACE\craftos2-release-resources\windows\CraftOS-PC.iss"
        (Get-Content $issPath) | Where-Object { $_ -notmatch 'ccemux-arm64\.dll' -and $_ -notmatch 'dll-arm' } | Set-Content $issPath
        & "C:\Program Files (x86)\Inno Setup 6\iscc" /DMyAppVersion=$VERSION /DWorkspaceDir=$env:GITHUB_WORKSPACE $issPath
    - name: Build portable package
      run: |
        echo F | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\bios.lua $env:GITHUB_WORKSPACE\bin\bios.lua /Q /K /Y
        echo F | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\hdfont.bmp $env:GITHUB_WORKSPACE\bin\hdfont.bmp /Q /K /Y
        echo D | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\rom $env:GITHUB_WORKSPACE\bin\rom /E /Q /K /Y
        echo D | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\debug $env:GITHUB_WORKSPACE\bin\debug /E /Q /K /Y
        xcopy $env:GITHUB_WORKSPACE\craftos2-release-resources\windows\dll\* $env:GITHUB_WORKSPACE\bin\ /Q /K /Y
        echo F | xcopy $env:GITHUB_WORKSPACE\craftos2-release-resources\windows\LICENSE.txt $env:GITHUB_WORKSPACE\bin\LICENSE.txt /Q /K /Y
        cd $env:GITHUB_WORKSPACE\bin
        Compress-Archive -Path * -DestinationPath ..\CraftOS-PC-Portable-Win64.zip
    - name: Build portable package (ARM)
      run: |
        echo F | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\bios.lua $env:GITHUB_WORKSPACE\bin-arm\bios.lua /Q /K /Y
        echo F | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\hdfont.bmp $env:GITHUB_WORKSPACE\bin-arm\hdfont.bmp /Q /K /Y
        echo D | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\rom $env:GITHUB_WORKSPACE\bin-arm\rom /E /Q /K /Y
        echo D | xcopy $env:GITHUB_WORKSPACE\craftos2-rom\debug $env:GITHUB_WORKSPACE\bin-arm\debug /E /Q /K /Y
        if (Test-Path "$env:GITHUB_WORKSPACE\craftos2-release-resources\windows\dll-arm") { xcopy $env:GITHUB_WORKSPACE\craftos2-release-resources\windows\dll-arm\* $env:GITHUB_WORKSPACE\bin-arm\ /Q /K /Y }
        echo F | xcopy $env:GITHUB_WORKSPACE\craftos2-release-resources\windows\LICENSE.txt $env:GITHUB_WORKSPACE\bin-arm\LICENSE.txt /Q /K /Y
        cd $env:GITHUB_WORKSPACE\bin-arm
        Compress-Archive -Path * -DestinationPath ..\CraftOS-PC-Portable-WinARM64.zip
    - name: Upload installer
      uses: shogo82148/actions-upload-release-asset@v1.10.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ github.workspace }}\CraftOS-PC-Setup.exe
        asset_name: CraftOS-PC-Setup.exe
        asset_content_type: application/vnd.microsoft.portable-executable
    - name: Upload portable archive
      uses: shogo82148/actions-upload-release-asset@v1.10.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ github.workspace }}\CraftOS-PC-Portable-Win64.zip
        asset_name: CraftOS-PC-Portable-Win64.zip
        asset_content_type: application/zip
    - name: Upload portable archive (ARM)
      uses: shogo82148/actions-upload-release-asset@v1.10.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ github.workspace }}\CraftOS-PC-Portable-WinARM64.zip
        asset_name: CraftOS-PC-Portable-WinARM64.zip
        asset_content_type: application/zip

  release-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 17 for Android SDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Set up JDK 11 for Gradle
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Download native libraries and assets
      run: |
        if [ ! -d resources/android-project/app/src/main/jniLibs ] || [ -z "$(ls -A resources/android-project/app/src/main/jniLibs 2>/dev/null)" ]; then
          echo "Fetching prebuilt native libraries and assets..."
          curl -sL -o /tmp/upstream.apk "https://github.com/MCJack123/craftos2/releases/download/v2.8.3/CraftOS-PC.apk"
          mkdir -p resources/android-project/app/src/main/jniLibs
          mkdir -p resources/android-project/app/src/main/assets
          unzip -q /tmp/upstream.apk "lib/*" -d /tmp/apk_extracted
          unzip -q /tmp/upstream.apk "assets/*" -d /tmp/apk_extracted
          cp -r /tmp/apk_extracted/lib/* resources/android-project/app/src/main/jniLibs/
          cp -r /tmp/apk_extracted/assets/* resources/android-project/app/src/main/assets/
          rm -rf /tmp/upstream.apk /tmp/apk_extracted
        fi
        git clone https://github.com/MCJack123/craftos2-rom /tmp/rom
        mkdir -p resources/android-project/app/src/main/assets/lua
        cp -r /tmp/rom/rom resources/android-project/app/src/main/assets/lua/
        cp /tmp/rom/bios.lua resources/android-project/app/src/main/assets/lua/bios.lua
        cp /tmp/rom/hdfont.bmp resources/android-project/app/src/main/assets/lua/hdfont.bmp
        rm -rf /tmp/rom
    - name: Build Android APK
      run: |
        cd resources/android-project
        chmod +x gradlew
        ./gradlew clean assembleRelease
        cd ../..
        if [ -f resources/android-project/app/build/outputs/apk/release/app-release.apk ]; then
          cp resources/android-project/app/build/outputs/apk/release/app-release.apk CraftOS.apk
        elif [ -f resources/android-project/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          jarsigner -keystore ~/.android/debug.keystore -storepass android -keypass android resources/android-project/app/build/outputs/apk/release/app-release-unsigned.apk androiddebugkey
          cp resources/android-project/app/build/outputs/apk/release/app-release-unsigned.apk CraftOS.apk
        fi
    - name: Upload APK Release Asset
      uses: shogo82148/actions-upload-release-asset@v1.10.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: CraftOS.apk
        asset_name: CraftOS.apk
        asset_content_type: application/vnd.android.package-archive

  hashes:
    name: Generate release hashes
    runs-on: ubuntu-latest
    needs: [release-windows, release-android]
    steps:
      - name: Generate Release Hashes
        uses: MCJack123/ghaction-Generate-Release-Hashes@v4
        with:
          file-name: hashes.txt
          get-assets: "true"
      - name: Upload a Release Asset
        uses: shogo82148/actions-upload-release-asset@v1.10.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: hashes.txt
          asset_name: sha256-hashes.txt
          asset_content_type: text/plain
